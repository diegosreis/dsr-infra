server {
    listen 80;
    server_name bangalostudio.com.br www.bangalostudio.com.br bangalostudio.com www.bangalostudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bangalostudio.com.br www.bangalostudio.com.br bangalostudio.com www.bangalostudio.com;

    ssl_certificate     /etc/letsencrypt/live/bangalostudio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bangalostudio.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* ^/storage/ {
        set $upstream_bangalo bangalo-app:3000;
        proxy_pass http://$upstream_bangalo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache imgcache;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location / {
        set $upstream_bangalo bangalo-app:3000;
        proxy_pass http://$upstream_bangalo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
