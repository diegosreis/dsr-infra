# Synced from gestaodental nginx/site.conf @ 4142d65 (PR #36).
# Divergência anterior: este arquivo NÃO existia no dsr-infra git
# (só era copiado pelo deploy do app). Fonte canônica do conteúdo: o app.
# Deploy do app continua podendo sobrescrever este template na VPS.
#
# Fonte: gestaodental/nginx/site.conf
# Deploy copia para: /opt/dsr-infra/nginx/sites/gestaodental.conf
# (incluído no http{} do gateway — map/log_format abaixo são válidos)

# Redaction de tokens de convite/intake nos access logs.
# Não altera a URI encaminhada à aplicação — só a saída de log.
# Manter em sync com nginx/intake-log-redaction.inc.conf
# Log output only: never use these variables for proxy_pass/fastcgi.
# Drop every query, Referer, user-agent and forwarded header from access logs.
map $request_uri $gd_path_without_args {
    default /[redacted];
    ~^([^?]*) $1;
}
map $gd_path_without_args $gd_safe_request_uri {
    default $gd_path_without_args;
    ~*% /[redacted-encoded-uri];
    ~*/api/v1/public/patient-intake/ /api/v1/public/patient-intake/[redacted];
    ~*/convite/ /convite/[redacted];
}
log_format gd_intake_safe '$remote_addr [$time_local] '
    '"$request_method $gd_safe_request_uri $server_protocol" '
    '$status $body_bytes_sent referer=[redacted] rt=$request_time';

server {
    listen 80;
    server_name gestaodental.online www.gestaodental.online;

    access_log /dev/stdout gd_intake_safe;
    error_log stderr warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gestaodental.online www.gestaodental.online;

    access_log /dev/stdout gd_intake_safe;
    error_log stderr warn;

    ssl_certificate     /etc/letsencrypt/live/gestaodental.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestaodental.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /up {
        set $upstream_orto_api ortoimplante-api:80;
        proxy_pass http://$upstream_orto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /docs {
        set $upstream_orto_api ortoimplante-api:80;
        proxy_pass http://$upstream_orto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # error_log stderr warn; a app continua logando com SensitiveUriRedactor.
    location ^~ /api/v1/public/patient-intake/ {
        error_log stderr warn;
        set $upstream_orto_api ortoimplante-api:80;
        proxy_pass http://$upstream_orto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/ {
        set $upstream_orto_api ortoimplante-api:80;
        proxy_pass http://$upstream_orto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location ^~ /public/ {
        set $upstream_orto_api ortoimplante-api:80;
        proxy_pass http://$upstream_orto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location ^~ /convite/ {
        error_log stderr warn;
        set $upstream_orto_web ortoimplante-web:80;
        proxy_pass http://$upstream_orto_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        set $upstream_orto_web ortoimplante-web:80;
        proxy_pass http://$upstream_orto_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
